[project]
name = "windforecast-backend"
version = "0.1.0"
description = "Day-ahead wind forecast decision support for a UK power procurement desk (Elexon WINDFOR vs FUELHH)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PL",       # pylint subset
    "ANN",      # type annotations
    "D",        # docstrings
    "PT",       # pytest style
    "C4",       # comprehensions
    "DTZ",      # naive datetime misuse
]
ignore = [
    "D100", "D104", "D107",  # module / package / __init__ docstrings not required everywhere
    "D203", "D213",          # conflicting docstring styles; we use D211 + D212
    "PLR0913",               # explicit keyword args beat a config object here
    "ANN401",                # Any is allowed in a few boundary signatures
    "PLR2004",               # magic-value comparisons in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR", "S101"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
markers = ["snapshot: tests that read the committed January 2026 snapshot"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> data -> domain (never the reverse)"
type = "layers"
layers = ["app.api", "app.services", "app.data", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: it may not import I/O layers or FastAPI"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.services", "app.data", "fastapi", "httpx", "pydantic_settings"]
